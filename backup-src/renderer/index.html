<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SwiftConvertor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="stage">
      <div id="drop-zone" class="drop-zone">
        <div class="drag-handle" title="Drag to move"></div>
        <button id="quit-button" class="quit-button" type="button" title="Quit" aria-label="Quit">
          ×
        </button>
        <div class="drop-content">
          <svg class="download-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 20h14" />
          </svg>
          <p id="file-name" class="file-name">Drop file</p>
          <p id="file-category" class="file-category"></p>
        </div>
      </div>
      <div id="wheel-container" class="wheel-container" aria-hidden="true"></div>
    </div>
    <script src="dropzone.js"></script>
    <script src="wheel.js"></script>
  </body>
</html>
